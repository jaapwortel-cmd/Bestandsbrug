<style>
:root { --achtergrond:#EEF2F7;--kaart:#FFFFFF;--tekst:#1A1F29;--zacht:#4A5363;--rand:#8A94A6;--accent:#0B5CAD;--op-accent:#FFFFFF;--accent-ingedrukt:#084685;--focus:#B34000;--kop:#0B4A8C;--op-kop:#FFFFFF; color-scheme: light; }

* { box-sizing: border-box; }

.kop h1 { margin: 0; font-size: 2rem; font-weight: 700; }

[role="menubar"] { display: flex; flex-wrap: wrap; gap: 0.25rem; list-style: none; margin: 0; padding: 0; }

main { max-width: 64rem; margin: 0 auto; padding: 1rem; display: grid; gap: 1rem; }

thead th { font-weight: 700; background: var(--achtergrond); }
td.getal { white-space: nowrap; }
.naamknop { font: inherit; font-weight: 600; color: var(--tekst); background: transparent; border: 2px solid transparent; border-radius: 0.5rem; padding: 0.3rem 0.5rem; cursor: pointer; text-align: left; width: 100%; }
.naamknop:hover { background: var(--achtergrond); }
.naamknop.map::before { content: "\1F4C1  "; }
.knop { font: inherit; font-weight: 600; border-radius: 999px; padding: 0.5rem 1.4rem; border: 2px solid var(--rand); background: var(--kaart); color: var(--tekst); cursor: pointer; }
.knop.hoofd { background: var(--accent); color: var(--op-accent); border-color: var(--accent); }
.knop:active { background: var(--achtergrond); }
.knop.hoofd:active { background: var(--accent-ingedrukt); }
.rij { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; margin-top: 0.8rem; }
label { display: block; font-weight: 600; color: var(--zacht); margin-top: 0.8rem; }
input[type="file"] { font: inherit; color: var(--tekst); margin-top: 0.3rem; max-width: 100%; }
.zacht { color: var(--zacht); }
#balk { position: relative; height: 1.6rem; border: 1px solid var(--rand); border-radius: 999px; background: var(--achtergrond); overflow: hidden; margin: 0.3rem 0 0.8rem; }
#balk .vulling { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 999px; transition: width .2s linear; }
#balk .pct { position: relative; display: block; text-align: center; font-weight: 600; font-size: 0.95rem; line-height: 1.6rem; color: var(--tekst); }
#balk.vol .pct { color: var(--op-accent); }
#melding { min-height: 3em; white-space: pre-wrap; }
h2 { font-size: 1.3rem; margin: 0.2rem 0 0.4rem; }
h3 { font-size: 1.15rem; margin: 1.2rem 0 0.4rem; }
h4 { font-size: 1.05rem; margin: 1rem 0 0.2rem; }
#help p, #help li { max-width: 60rem; }
textarea { width: 100%; font: 0.95rem/1.4 Consolas, "Courier New", monospace; color: var(--tekst); background: var(--achtergrond); border: 1px solid var(--rand); border-radius: 0.5rem; padding: 0.5rem; }
dialog { background: var(--kaart); color: var(--tekst); border: 2px solid var(--rand); border-radius: 1rem; padding: 1.25rem; max-width: 34rem; }
dialog::backdrop { background: rgba(0,0,0,.5); }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.verborgen-visueel { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (forced-colors: active) {
  .kop, nav, .kaart, [role="tab"], .knop, #balk, [role="menu"], dialog { border: 1px solid CanvasText; }
  [role="tab"][aria-selected="true"], .knop.hoofd, #balk .vulling { background: Highlight; color: HighlightText; forced-color-adjust: none; }
  :focus-visible { outline: 3px solid Highlight; }
}

"use strict";
const D = {"downloadCode":"kZKkpV7ZSEUm89aPdvkSed1XufCjyVpwGCfk","meldSeconden":6,"privacy":{"en":"PRIVACY STATEMENT FILEBRIDGE\r\nLast updated: 11 November 2026\r\n\r\n1. Who am I?\r\nI am Jaap Wortel. I made the app Filebridge. I am blind, and I make programs that also work well with a screen reader. I want everyone to be able to use my apps easily.\r\n\r\n2. What is Filebridge for?\r\nWith Filebridge you can download my apps. You can also send me a file yourself (upload).\r\n\r\n3. What data do I collect?\r\nI do not collect data about you. The app has no sign-in, no cookies, no ads and no tracking. I do not know who uses the app, and I do not know how often.\r\nThere are two small exceptions:\r\n- If you upload a file, it goes to my pCloud. Only I can see it. I only use it for the reason you sent it.\r\n- If you email me, I get your email address and your message. I only use them to reply to you.\r\n\r\n4. What stays on your own computer?\r\nYour choices (language and light or dark view), an interrupted download or upload, and the log file stay on your own computer. In the single HTML version, your choices stay in your own browser. I do not receive any of this automatically. I do not send the log file to myself. Do you want to help me with a problem? Then you can email the log file yourself. The log file contains no passwords and no personal data.\r\n\r\n5. Other companies\r\nI do not have my own server. Filebridge connects to pCloud (to download and upload) and to Dropbox (to check whether there is a new version). These companies can see technical data, such as your IP address. I have no control over that. Please also read their privacy statements.\r\n\r\n6. Email and questions\r\nDo you have a question about the app or about privacy? Email me at jaap.wortel@gmail.com. I will answer within two working days. I only use your email address to reply to you. Do you want me to delete your email because of your privacy? Tell me, and I will delete it. This also applies to a file you have uploaded.\r\n\r\n7. Your rights\r\nYou can ask me what data I have about you. You can ask me to correct or delete it. You can also ask me to stop using it. Email me to do this. Are you not satisfied? Then you can file a complaint with the Dutch Data Protection Authority, the Autoriteit Persoonsgegevens (autoriteitpersoonsgegevens.nl).\r\n\r\n8. How long do I keep data?\r\nI do not keep your email or your file longer than necessary. If you ask me to delete it, I will.\r\n\r\n9. Responsibility\r\nI made Filebridge to help others. You use the app at your own risk. For the rest, I am not responsible for how the app is used, as far as the law allows. This also applies to damage from a download, an upload or an update. Do not send files that are forbidden or that can cause harm. I may delete such files.\r\n\r\n10. Changes\r\nI may change this statement. The newest version is in the app, under Help. The date is at the top.\r\n","nl":"PRIVACYVERKLARING BESTANDSBRUG\r\nLaatst bijgewerkt: 11 november 2026\r\n\r\n1. Wie ben ik?\r\nIk ben Jaap Wortel. Ik heb de app Bestandsbrug gemaakt. Ik ben blind en maak programma's die ook goed werken met een schermlezer. Ik wil dat iedereen mijn apps makkelijk kan gebruiken.\r\n\r\n2. Waarvoor is Bestandsbrug?\r\nMet Bestandsbrug kun je mijn apps downloaden. Je kunt ook zelf een bestand naar mij sturen (uploaden).\r\n\r\n3. Welke gegevens verzamel ik?\r\nIk verzamel geen gegevens over jou. De app heeft geen aanmelding, geen cookies, geen reclame en geen volgprogramma's. Ik weet niet wie de app gebruikt en ook niet hoe vaak.\r\nEr zijn twee kleine uitzonderingen:\r\n- Als je een bestand uploadt, komt dat bestand in mijn pCloud. Alleen ik kan het zien. Ik gebruik het alleen voor het doel waarvoor je het hebt gestuurd.\r\n- Als je mij mailt, krijg ik je e-mailadres en je bericht. Ik gebruik die alleen om je te antwoorden.\r\n\r\n4. Wat blijft op je eigen computer?\r\nJe keuzes (taal en lichte of donkere weergave), een onderbroken download of upload en het logbestand blijven op je eigen computer. In de losse HTML-versie blijven je keuzes in je eigen browser. Ik krijg dit niet automatisch. Het logbestand stuur ik niet naar mezelf. Wil je mij helpen bij een probleem? Dan kun je het logbestand zelf mailen. In het logbestand staan geen wachtwoorden en geen persoonlijke gegevens.\r\n\r\n5. Andere bedrijven\r\nIk heb geen eigen server. Bestandsbrug maakt verbinding met pCloud (om te downloaden en te uploaden) en met Dropbox (om te kijken of er een nieuwe versie is). Deze bedrijven kunnen technische gegevens zien, zoals je IP-adres. Daar heb ik geen invloed op. Lees ook hun privacyverklaringen.\r\n\r\n6. Mailen en vragen\r\nHeb je een vraag over de app of over privacy? Mail me dan op jaap.wortel@gmail.com. Ik antwoord binnen twee werkdagen. Ik gebruik je e-mailadres alleen om je te antwoorden. Wil je dat ik je mail weggooi vanwege je privacy? Zeg het mij, dan verwijder ik hem. Dat geldt ook voor een bestand dat je hebt geüpload.\r\n\r\n7. Jouw rechten\r\nJe mag mij vragen welke gegevens ik van je heb. Je mag vragen om ze te verbeteren of te verwijderen. Je mag ook vragen om ze niet meer te gebruiken. Mail mij daarvoor. Ben je niet tevreden? Dan kun je een klacht indienen bij de Autoriteit Persoonsgegevens (autoriteitpersoonsgegevens.nl).\r\n\r\n8. Hoe lang bewaar ik gegevens?\r\nIk bewaar je mail of je bestand niet langer dan nodig is. Vraag je om verwijdering, dan doe ik dat.\r\n\r\n9. Verantwoordelijkheid\r\nIk heb Bestandsbrug gemaakt om anderen te helpen. Je gebruikt de app op eigen risico. Ik ben voor de rest niet verantwoordelijk voor het gebruik van de app, voor zover de wet dat toestaat. Dat geldt ook voor schade door een download, een upload of een update. Stuur geen bestanden die verboden zijn of schade kunnen doen. Ik mag zulke bestanden weggooien.\r\n\r\n10. Wijzigingen\r\nIk kan deze verklaring aanpassen. De nieuwste versie staat in de app, onder Help. Bovenaan staat de datum.\r gBestand":"Je browser laat Bestandsbrug niet met pCloud praten. Gebruik een andere browser, of de Windows-app.","WebGekopieerd":"Het logboek is gekopieerd.","WebHelpPagina":"Help","WebHoofdmenu":"Hoofdmenu","WebKopieer":"Logboek kopiëren","WebLogboek":"Logboek","WebLogboekUitleg":"Hier staat wat er gebeurd is. Wil je Jaap helpen bij een probleem? Kopieer het logboek en mail het naar Jaap.","WebMapZip":"De map {0} wordt gedownload als zip-bestand. Je browser kan geen mappen maken. Open het zip-bestand in de Verkenner om de map te zien.","WebNietGekopieerd":"Kopiëren lukt niet. Selecteer de tekst in het logboek en kopieer hem zelf met Ctrl+C.","WebPrivacyEn":"Privacy statement (English)","WebPrivacyNl":"Privacyverklaring (Nederlands)","WebTerug":"Terug","WebVersie":"Versie {0}","WeergaveDonker":"Donkere weergave is nu gekozen.","WeergaveLicht":"Lichte weergave is nu gekozen."}},"uitleg":{"en":"INSTRUCTIONS FOR Filebridge\r\n\r\n1. What does Filebridge do?\r\nWith Filebridge you can download Jaap's apps. You can also send a file to Jaap (upload). Everything goes through pCloud. You do not need to sign in.\r\n\r\n2. Download an app\r\nGo to the Download tab. It works like File Explorer in Windows. First you see the folders, one for each app. Use the up and down arrows to move. Press Enter to open a folder. The files are inside. Press Backspace (or the Up one folder button) to go back to the folder above. Choose a file and press Enter, or choose the Download button.\r\nTo copy a whole folder to your computer: choose the folder (without opening it) and choose the Download button, or press Ctrl+C. Then choose where the folder should go. The folder appears there with all its files and folders. Choose where you want to save the file. By default this is the Downloads folder.\r\nPress F5 to get the list again. If something is new in the list since last time, you hear it when starting. The Type column then says \"new\", also next to the folder it is in.\r\n\r\n3. Send a file to Jaap\r\nGo to the Upload tab, with Ctrl+Tab or Ctrl+2. Choose Choose file, or Choose folder for a whole folder. Then choose Upload. A whole folder reaches Jaap as one zip file, with all folders and files in it. You hear \"Done, thank you!\" when it worked. You cannot see files from other people. Only Jaap can see them.\r\n\r\n4. The progress\r\nDuring a download or upload, you hear every 6 seconds how far it is. For example: Downloading, 40 percent, about 20 seconds left.\r\n\r\n5. Stop with Escape\r\nPress Escape during a download or upload. You then get three choices:\r\n- Continue: the download just goes on.\r\n- Continue next time: the download stops. When you open Filebridge again, you can continue.\r\n- Cancel everything now: everything stops and the half file is removed.\r\nAn upload cannot continue later. There you only have Continue and Cancel everything now.\r\n\r\n6. Shortcut keys\r\n- Ctrl+Tab: go to the other tab. Ctrl+1: Download. Ctrl+2: Upload.\r\n- Enter: open the chosen folder, or download the chosen file.\r\n- Backspace: go back to the folder above.\r\n- Ctrl+C or Alt+D: download the chosen file, or copy the chosen folder with everything in it.\r\n- F5: refresh the list.\r\n- F1: these instructions.\r\n- Alt+F4: quit Filebridge.\r\n- Escape: during a download or upload, the question what you want to do. In this window: close.\r\n\r\n7. View and language\r\nIn the Accessibility menu you choose a light or dark view. In the Language menu you choose Nederlands or English. Filebridge remembers your choice.\r\n\r\n8. Updates\r\nAfter starting, Filebridge checks if there is a new version. If there is one, you will hear it. Then choose Check for updates in the Help menu.\r\n\r\n9. Help with a problem\r\nIn the Help menu you can open the log file. It shows what happened. Do you want to help Jaap? Then email the log file to Jaap. The address is in the privacy statement.\r\n","nl":"UITLEG OVER Bestandsbrug\r\n\r\n1. Wat doet Bestandsbrug?\r\nMet Bestandsbrug kun je de apps van Jaap downloaden. Je kunt ook een bestand naar Jaap sturen (uploaden). Alles gaat via pCloud. Je hoeft je niet aan te melden.\r\n\r\n2. Een app downloaden\r\nGa naar het tabblad Downloaden. Het werkt zoals de Verkenner van Windows. Je ziet eerst de mappen, één per app. Loop met de pijltjes omhoog en omlaag. Druk op Enter om een map te openen. Daarin staan de bestanden. Met Backspace (of de knop Map omhoog) ga je terug naar de map erboven. Kies een bestand en druk op Enter, of kies de knop Downloaden.\r\nEen hele map kopiëren naar je computer: kies de map (zonder hem te openen) en kies de knop Downloaden, of druk op Ctrl+C. Kies daarna waar de map moet komen. De map komt daar met alle bestanden en mappen erin. Kies waar je het bestand wilt opslaan. Standaard is dat de map Downloads.\r\nMet F5 haal je de lijst opnieuw op. Staat er iets nieuws in de lijst sinds de vorige keer, dan hoor je dat bij het opstarten. In de kolom Soort staat dan \"nieuw\", ook bij de map waar het in staat.\r\n\r\n3. Een bestand naar Jaap sturen\r\nGa naar het tabblad Uploaden, met Ctrl+Tab of Ctrl+2. Kies Bestand kiezen, of Map kiezen voor een hele map. Kies daarna Uploaden. Een hele map komt bij Jaap als één zip-bestand, met alle mappen en bestanden erin. Je hoort \"Klaar, bedankt!\" als het gelukt is. Je kunt de bestanden van anderen niet zien. Alleen Jaap ziet ze.\r\n\r\n4. De voortgang\r\nTijdens een download of upload hoor je elke 6 seconden hoe ver hij is. Bijvoorbeeld: Downloaden, 40 procent, nog ongeveer 20 seconden.\r\n\r\n5. Stoppen met Escape\r\nDruk tijdens een download of upload op Escape. Je krijgt dan drie keuzes:\r\n- Doorgaan: de download gaat gewoon verder.\r\n- Volgende keer verdergaan: de download stopt. Als je Bestandsbrug weer opent, kun je verdergaan.\r\n- Alles nu annuleren: alles stopt en het halve bestand wordt weggehaald.\r\nEen upload kan niet later verdergaan. Daar heb je alleen Doorgaan en Alles nu annuleren.\r\n\r\n6. Sneltoetsen\r\n- Ctrl+Tab: naar het andere tabblad. Ctrl+1: Downloaden. Ctrl+2: Uploaden.\r\n- Enter: de gekozen map openen, of het gekozen bestand downloaden.\r\n- Backspace: terug naar de map erboven.\r\n- Ctrl+C of Alt+D: het gekozen bestand downloaden, of de gekozen map met alles erin kopiëren.\r\n- F5: de lijst vernieuwen.\r\n- F1: deze uitleg.\r\n- Alt+F4: Bestandsbrug afsluiten.\r\n- Escape: tijdens een download of upload de vraag wat je wilt doen. In dit venster: sluiten.\r\n\r\n7. Weergave en taal\r\nIn het menu Toegankelijkheid kies je een lichte of donkere weergave. In het menu Taal kies je Nederlands of English. Bestandsbrug onthoudt je keuze.\r\n\r\n8. Updates\r\nBestandsbrug kijkt na het opstarten of er een nieuwe versie is. Is die er, dan hoor je dat. Kies dan in het menu Help de optie Controleren op updates.\r\n\r\n9. Hulp bij een probleem\r\nIn het menu Help kun je het logbestand openen. Daarin staat wat er gebeurd is. Wil je Jaap helpen? Mail het logbestand dan naar Jaap. Het adres staat in de privacyverklaring.\r\n"},"uitlegBestand":"uitleg.txt","uploadCode":"mvG7ZMqpSiwM6Ap7npVdoCl7ULXzQmX6V","uploader":"Bestandsbrug","versie":"1.0.1"};

  lees(k) { try { return localStorage.getItem("bestandsbrug." + k); } catch (e) { return null; } },
  zet(k, v) { try { localStorage.setItem("bestandsbrug." + k, v); } catch (e) {} },
};
let taal = opslag.lees("taal") || ((navigator.language || "").toLowerCase().startsWith("nl") ? "nl" : "en");
if (!D.teksten[taal]) taal = "en";
let weergave = opslag.lees("weergave") || (matchMedia("(prefers-color-scheme: dark)").matches ? "donker" : "licht");
let lijst = [];
let upload = null; // { xhr, naam, gedaan, totaal, start, vorigeMelding }
const logboek = [];

const t = (k) => (D.teksten[taal][k] || k);
const f = (k, ...w) => w.reduce((s, x, i) => s.split("{" + i + "}").join(x), t(k));

function log(regel) {
  const nu = new Date();
  const p = (n) => String(n).padStart(2, "0");
  logboek.push(`${nu.getFullYear()}-${p(nu.getMonth() + 1)}-${p(nu.getDate())} ${p(nu.getHours())}:${p(nu.getMinutes())}:${p(nu.getSeconds())} ${regel}`);
  if (logboek.length > 500) logboek.shift();
  $("logboek").value = logboek.join("\n");
}

// Meldingen: het aria-live-gebied wordt alleen hier bijgewerkt (begin, einde, fout, keuzes en de timer).
let meldTimer = 0;
function zeg(tekst) {
  $("melding").textContent = "";
  clearTimeout(meldTimer);
  meldTimer = setTimeout(() => { $("melding").textContent = tekst; }, 60);
}

function grootte(b) {
  const KB = 1024;
  if (b < KB) return b + " bytes";
  let [g, e] = b < KB * KB ? [b / KB, "KB"] : b < KB ** 3 ? [b / KB / KB, "MB"] : [b / KB ** 3, "GB"];
  const s = g >= 100 ? g.toFixed(0) : g.toFixed(1);
  return s.replace(".", t("Decimaalteken")) + " " + e;
}

function datum(s) {
  const d = new Date(s);
  if (isNaN(d)) return s;
  const p = (n) => String(n).padStart(2, "0");
  return t("DatumVorm").replace("{d}", d.getDate()).replace("{maand}", t("Maand" + (d.getMonth() + 1)))
    .replace("{jaar}", d.getFullYear()).replace("{uur}", p(d.getHours())).replace("{min}", p(d.getMinutes()));
}

// Tekst (uitleg of privacyverklaring) als kopjes en alinea's, woord voor woord.
function zetTekst(doel, tekst) {
  doel.textContent = "";
  let ul = null;
  tekst.split(/\r?\n/).forEach((regel, i) => {
    const r = regel.trim();
    if (!r) { ul = null; return; }
    let el;
    if (i === 0) { el = document.createElement("h4"); }
    else if (/^\d+\.\s/.test(r)) { el = document.createElement("h4"); ul = null; }
    else if (r.startsWith("- ")) {
      if (!ul) { ul = document.createElement("ul"); doel.appendChild(ul); }
      const li = document.createElement("li"); li.textContent = r.slice(2); ul.appendChild(li); return;
    } else { el = document.createElement("p"); ul = null; }
    el.textContent = r;
    doel.appendChild(el);
  });
}

function zetTeksten() {
  document.documentElement.lang = taal;
  document.title = t("AppNaam");
  $("appnaam").textContent = t("AppNaam");
  $("menu").setAttribute("aria-label", t("WebHoofdmenu"));
  $("tabs").setAttribute("aria-label", t("AppNaam"));
  document.querySelectorAll("[data-tekst]").forEach((el) => { el.textContent = t(el.dataset.tekst); });
  $("upload-uitleg").textContent = t("UploadUitleg");
  $("versie").textContent = f("WebVersie", D.versie);
  zetTekst($("uitleg-tekst"), D.uitleg[taal]);
  zetTekst($("privacy-nl"), D.privacy.nl);
  zetTekst($("privacy-en"), D.privacy.en);
  document.querySelectorAll('[data-actie="taal-nl"],[data-actie="taal-en"]').forEach((el) => el.setAttribute("aria-checked", String(el.dataset.actie === "taal-" + taal)));
  document.querySelectorAll('[data-actie="licht"],[data-actie="donker"]').forEach((el) => el.setAttribute("aria-checked", String(el.dataset.actie === weergave)));
  zetBalk($("balk").dataset.waarde || 0, true);
  toonLijst();
}

function zetWeergave() {
  document.documentElement.dataset.weergave = weergave;
}

// ---------- pCloud ----------
async function api(methode, params) {
  let fout;
  for (const server of D.servers) {
    const url = server + "/" + methode + "?" + new URLSearchParams(params);
    try {
      const r = await fetch(url, { cache: "no-store" });
      return await r.json();
    } catch (e) { fout = e; }
  }
  throw fout;
}

function foutTekst(json) {
  const c = json && json.result;
  if ([7001, 7002, 7004, 7005, 7006].includes(c)) return t("FoutLinkWeg");
  if ([7007, 7008].includes(c)) return t("FoutUploadVol");
  return f("FoutPcloud", (json && json.error) || String(c));
}

async function haalLijst(handmatig) {
  if (handmatig) zeg(t("LijstLaden"));
  try {
    const j = await api("showpublink", { code: D.downloadCode });
    if (j.result !== 0) throw { pcloud: j };
    // Alle bestanden, ook in mappen; op het scherm komen ze als mappen met de bestanden eronder.
    const items = [];
    mapIds = {};
    (function verzamel(m, pad) {
      for (const x of m.contents || []) {
        if (x.isfolder) { const p = pad ? pad + "/" + x.name : x.name; mapIds[p] = x.folderid; verzamel(x, p); }
        else if (!isSysteem(x.name)) items.push({ ...x, map: pad });
      }
    })(j.metadata || {}, "");
    const uitlegs = items.filter((x) => x.name.toLowerCase() === D.uitlegBestand);
    lijst = items.filter((x) => !uitlegs.includes(x)).map((x) => ({ fileid: x.fileid, hash: x.hash, naam: x.name, map: x.map, grootte: x.size, datum: x.modified, uitleg: "" }))
      .sort((a, b) => (a.map.toLowerCase() + "\u0000" + a.naam.toLowerCase()).localeCompare(b.map.toLowerCase() + "\u0000" + b.naam.toLowerCase()));
    // Wat is er nieuw sinds de vorige keer? (Je browser onthoudt welke bestanden je al zag.)
    let gezien = null;
    try { gezien = JSON.parse(opslag.lees("gezien") || "null"); } catch (e) {}
    const erbij = gezien ? lijst.filter((b) => !gezien.includes(sleutel(b))) : [];
    opslag.zet("gezien", JSON.stringify(lijst.map(sleutel)));
    erbij.forEach((b) => nieuw.add(sleutel(b)));
    toonLijst();
    log(`INFO List loaded: ${lijst.length} files, ${erbij.length} new`);
    let m = lijst.length === 0 ? t("LijstLeeg") : lijst.length === 1 ? t("LijstEenBestand") : f("LijstGeladen", String(lijst.length));
    if (erbij.length > 3) m += " " + f("NieuwVeel", String(erbij.length));
    else if (erbij.length) m += " " + f("NieuwSinds", erbij.map((b) => b.map ? f("NieuwInMap", b.naam, b.map.split("/").join(" > ")) : b.naam).join(", "));
    zeg(m);
    uitlegs.forEach((u) => haalUitleg(u.fileid));
  } catch (e) {
    const tekst = e && e.pcloud ? foutTekst(e.pcloud) : t("FoutGeenInternet");
    log("ERROR List failed: " + (e && e.pcloud ? JSON.stringify(e.pcloud) : String(e)));
    zeg(f("FoutLijst", tekst));
  }
}

// uitleg.txt lezen lukt alleen als de browser het toestaat; anders gewoon zonder uitleg.
async function haalUitleg(fileid) {
  try {
    const j = await api("getpublinkdownload", { code: D.downloadCode, fileid });
    const r = await fetch("https://" + j.hosts[0] + j.path);
    const kaart = {};
    (await r.text()).split(/\r?\n/).forEach((regel) => {
      const i = regel.indexOf("=");
      if (i > 0 && !regel.trim().startsWith("#")) kaart[regel.slice(0, i).trim().toLowerCase()] = regel.slice(i + 1).trim();
    });
    lijst.forEach((b) => { if (kaart[b.naam.toLowerCase()]) b.uitleg = kaart[b.naam.toLowerCase()]; });
    toonLijst();
  } catch (e) { log("INFO uitleg.txt not readable in this browser"); }
}

// Zoals de Verkenner: de mappen en bestanden van één map. Enter op een map = openen, op een bestand =
// downloaden. Backspace of de knop "Map omhoog" = naar de map erboven.
let huidigeMap = "";
let mapIds = {};
let nieuw = new Set();
const sleutel = (b) => b.fileid + ":" + b.hash;
const SYSTEEM = ["desktop.ini", "thumbs.db", ".ds_store", "ehthumbs.db"];
const isSysteem = (n) => SYSTEEM.includes(n.toLowerCase()) || n.startsWith("~$") || n.startsWith("._");
function inhoudVan(pad) {
  const mappen = new Map(), bestanden = [];
  for (const b of lijst) {
    if (b.map === pad) { bestanden.push(b); continue; }
    if (pad === "" || b.map.startsWith(pad + "/")) {
      const rest = pad === "" ? b.map : b.map.slice(pad.length + 1);
      const naam = rest.split("/")[0];
      if (naam) mappen.set(naam, (mappen.get(naam) || new Set()).add(rest.split("/")[1] ? "m:" + rest.split("/")[1] : "b:" + b.fileid));
    }
  }
  const vgl = (a, b) => a.toLowerCase().localeCompare(b.toLowerCase());
  return {
    mappen: [...mappen].map(([naam, items]) => ({ naam, aantal: items.size })).sort((a, b) => vgl(a.naam, b.naam)),
    bestanden: bestanden.sort((a, b) => vgl(a.naam, b.naam)),
  };
}
function toonLijst(kiesMap) {
  if (huidigeMap && !lijst.some((b) => b.map === huidigeMap || b.map.startsWith(huidigeMap + "/"))) huidigeMap = "";
  const { mappen, bestanden } = inhoudVan(huidigeMap);
  $("lijstnaam").textContent = huidigeMap ? f("LijstInMap", huidigeMap.split("/").join(" > ")) : t("LijstNaam");
  const tb = document.querySelector("#bestanden tbody");
  tb.textContent = "";
  let teFocussen = null;
  const rij = (naamEl, soort, grootteTekst, datumTekst, uitleg, naam, actie) => {
    const tr = document.createElement("tr");
    const th = document.createElement("th"); th.scope = "row"; th.appendChild(naamEl); tr.appendChild(th);
    for (const [w, k] of [[soort, ""], [grootteTekst, "getal"], [datumTekst, "getal"], [uitleg, ""]]) {
      const td = document.createElement("td"); td.textContent = w; if (k) td.className = k; tr.appendChild(td);
    }
    const td = document.createElement("td");
    const knop = document.createElement("button");
    knop.className = "knop hoofd"; knop.textContent = t("KnopDownloaden");
    knop.setAttribute("aria-label", t("KnopDownloaden") + ": " + naam);
    knop.addEventListener("click", actie);
    td.appendChild(knop); tr.appendChild(td);
    tb.appendChild(tr);
  };
  for (const m of mappen) {
    const k = document.createElement("button");
    k.className = "naamknop map"; k.textContent = m.naam; k.dataset.map = m.naam;
    k.addEventListener("click", () => openMap(huidigeMap ? huidigeMap + "/" + m.naam : m.naam));
    if (kiesMap === m.naam) teFocussen = k;
    const pad = huidigeMap ? huidigeMap + "/" + m.naam : m.naam;
    const mapNieuw = lijst.some((b) => (b.map === pad || b.map.startsWith(pad + "/")) && nieuw.has(sleutel(b)));
    rij(k, mapNieuw ? f("SoortNieuw", t("SoortMap")) : t("SoortMap"), f("AantalItems", String(m.aantal)), "", "", m.naam, () => downloadMap(pad, m.naam));
  }
  for (const b of bestanden) {
    const k = document.createElement("button");
    k.className = "naamknop"; k.textContent = b.naam;
    k.setAttribute("aria-label", b.naam + ", " + t("KnopDownloaden"));
    k.addEventListener("click", () => download(b));
    rij(k, nieuw.has(sleutel(b)) ? f("SoortNieuw", t("SoortBestand")) : t("SoortBestand"), grootte(b.grootte), datum(b.datum), b.uitleg, b.naam, () => download(b));
  }
  return teFocussen || tb.querySelector("button");
}
function openMap(pad) {
  huidigeMap = pad;
  const eerste = toonLijst();
  if (eerste) eerste.focus();
  zeg(f("MapGeopend", pad.split("/").pop(), String(document.querySelectorAll("#bestanden tbody tr").length)));
}
function mapOmhoog() {
  if (!huidigeMap) { zeg(t("AlInHoofdmap")); return; }
  const delen = huidigeMap.split("/");
  const vorige = delen.pop();
  huidigeMap = delen.join("/");
  const k = toonLijst(vorige);
  if (k) k.focus();
  zeg(huidigeMap ? f("TerugInMap", delen[delen.length - 1]) : t("TerugHoofdmap"));
}
$("bestanden").addEventListener("keydown", (e) => {
  if (e.key === "Backspace") { e.preventDefault(); mapOmhoog(); }
});
$("knop-omhoog").addEventListener("click", mapOmhoog);

// Een hele map: pCloud maakt er een zip-bestand van (een browser kan zelf geen mappen maken).
function downloadMap(pad, naam) {
  const a = document.createElement("a");
  a.href = D.servers[0] + "/getpubzip?" + new URLSearchParams({ code: D.downloadCode, folderid: mapIds[pad], filename: naam + ".zip", forcedownload: 1 });
  a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  log("INFO Folder download started in browser (zip): " + naam);
  zeg(f("WebMapZip", naam));
}

// Downloaden gaat via de browser zelf (de downloadservers van pCloud staan geen voortgang toe vanuit een los bestand).
async function download(b) {
  try {
    const j = await api("getpublinkdownload", { code: D.downloadCode, fileid: b.fileid, forcedownload: 1 });
    if (j.result !== 0) { zeg(f("MeldDownloadFout", foutTekst(j))); log("ERROR Download failed: " + b.naam + ": " + j.result); return; }
    const a = document.createElement("a");
    a.href = "https://" + j.hosts[0] + j.path;
    a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    log(`INFO Download started in browser: ${b.naam} (${b.grootte} bytes)`);
    zeg(f("WebDownloadGestart", b.naam));
  } catch (e) {
    log("ERROR Download failed: " + b.naam + ": " + e);
    zeg(f("MeldDownloadFout", t("FoutGeenInternet")));
  }
}

// ---------- Uploaden, met voortgang elke 6 seconden ----------
function zetBalk(pct, ookVoorSchermlezer) {
  pct = Math.max(0, Math.min(100, Math.floor(pct)));
  $("balk").dataset.waarde = pct;
  $("balk").querySelector(".vulling").style.width = pct + "%";
  $("balk").querySelector(".pct").textContent = pct ? pct + " %" : "";
  $("balk").classList.toggle("vol", pct >= 50);
  if (ookVoorSchermlezer) {
    $("balk").setAttribute("aria-valuenow", String(pct));
    $("balk").setAttribute("aria-valuetext", f("BalkWaarde", String(pct)));
  }
}

function restTekst(sec) {
  if (sec < 60) { const a = Math.max(5, Math.ceil(sec / 5) * 5); return a >= 60 ? t("MeldNogMinuut") : f("MeldNogSeconden", String(a)); }
  const m = Math.round(sec / 60);
  return m <= 1 ? t("MeldNogMinuut") : f("MeldNogMinuten", String(m));
}

function voortgangTekst() {
  const pct = upload.totaal ? Math.floor(upload.gedaan * 100 / upload.totaal) : 0;
  let s = f("MeldUploadVoortgang", String(pct));
  const sec = (Date.now() - upload.start) / 1000;
  if (upload.gedaan > 0 && sec >= 1) s += restTekst(Math.ceil((upload.totaal - upload.gedaan) / (upload.gedaan / sec)));
  return s + ".";
}

setInterval(() => {
  if (!upload || $("vraag").open) return;
  if (Date.now() - upload.vorigeMelding + 150 >= D.meldSeconden * 1000) {
    upload.vorigeMelding = Date.now();
    zetBalk(upload.totaal ? upload.gedaan * 100 / upload.totaal : 0, true);
    zeg(voortgangTekst());
  }
}, 500);

// Een map wordt één zip-bestand met alles erin (zonder inpakken, "stored"), net als in de Windows-app.
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes, c = 0xffffffff) { for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xff] ^ (c >>> 8); return c; }
async function maakZip(bestanden) {
  const delen = [], centraal = []; let plek = 0;
  const enc = new TextEncoder();
  for (const b of bestanden) {
    if (b.size >= 0xffffffff) throw new Error("te groot");
    const naam = enc.encode(b.webkitRelativePath || b.name);
    let c = 0xffffffff;
    const lezer = b.stream().getReader();
    for (;;) { const { done, value } = await lezer.read(); if (done) break; c = crc32(value, c); }
    c = (c ^ 0xffffffff) >>> 0;
    const kop = new DataView(new ArrayBuffer(30));
    kop.setUint32(0, 0x04034b50, true); kop.setUint16(4, 20, true); kop.setUint16(6, 0x0800, true);
    kop.setUint32(14, c, true); kop.setUint32(18, b.size, true); kop.setUint32(22, b.size, true); kop.setUint16(26, naam.length, true);
    delen.push(kop.buffer, naam, b);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true);
    cd.setUint32(16, c, true); cd.setUint32(20, b.size, true); cd.setUint32(24, b.size, true); cd.setUint16(28, naam.length, true);
    cd.setUint32(42, plek, true);
    centraal.push(cd.buffer, naam);
    plek += 30 + naam.length + b.size;
    if (plek >= 0xffffffff) throw new Error("te groot");
  }
  const cdGrootte = centraal.reduce((s, x) => s + x.byteLength, 0);
  const eind = new DataView(new ArrayBuffer(22));
  eind.setUint32(0, 0x06054b50, true); eind.setUint16(8, bestanden.length, true); eind.setUint16(10, bestanden.length, true);
  eind.setUint32(12, cdGrootte, true); eind.setUint32(16, plek, true);
  return new Blob([...delen, ...centraal, eind.buffer], { type: "application/zip" });
}
let uploadKeuze = "bestand";
$("upload-bestand").addEventListener("change", () => { uploadKeuze = "bestand"; if ($("upload-bestand").files[0]) zeg(f("GekozenMelding", $("upload-bestand").files[0].name)); });
$("upload-map").addEventListener("change", () => {
  uploadKeuze = "map";
  const fs = $("upload-map").files;
  if (fs.length) zeg(f("GekozenMapMelding", (fs[0].webkitRelativePath || "").split("/")[0]));
});

async function startUpload() {
  if (upload) { zeg(t("AlBezig")); return; }
  let bestand = $("upload-bestand").files[0];
  let mapNaam = "", aantal = 0;
  if (uploadKeuze === "map" && $("upload-map").files.length) {
    const fs = [...$("upload-map").files];
    mapNaam = (fs[0].webkitRelativePath || "map").split("/")[0];
    aantal = fs.length;
    try { bestand = new File([await maakZip(fs)], mapNaam + ".zip", { type: "application/zip" }); }
    catch (e) { zeg(f("MeldUploadFout", f("FoutLezen", String(e.message || e)))); return; }
  }
  if (!bestand) { zeg(t("GeenUploadKeuze")); return; }
  if (bestand.size === 0) { zeg(t("LeegBestand")); return; }
  try {
    const j = await api("showuploadlink", { code: D.uploadCode });
    if (j.result !== 0) { zeg(f("MeldUploadFout", foutTekst(j))); return; }
    if (j.maxspace > 0) {
      const magNog = Math.max(0, j.maxspace - Math.max(j.space || 0, j.usedspace || 0));
      if (magNog === 0) { zeg(f("MeldUploadFout", t("FoutUploadVol"))); return; }
      if (bestand.size > magNog) { zeg(f("MeldUploadFout", f("FoutTeGroot", grootte(magNog), grootte(bestand.size)))); return; }
    }
    if (j.maxfiles > 0 && (j.files || 0) >= j.maxfiles) { zeg(f("MeldUploadFout", t("FoutUploadVol"))); return; }
  } catch (e) { zeg(f("MeldUploadFout", t("FoutGeenInternet"))); return; }
  const xhr = new XMLHttpRequest();
  upload = { xhr, naam: bestand.name, gedaan: 0, totaal: bestand.size, start: Date.now(), vorigeMelding: Date.now() };
  const url = D.servers[0] + "/uploadtolink?" + new URLSearchParams({ code: D.uploadCode, names: D.uploader, nopartial: 1 });
  xhr.open("POST", url);
  xhr.upload.onprogress = (e) => { if (upload && e.lengthComputable) { upload.gedaan = e.loaded; upload.totaal = e.total; zetBalk(e.loaded * 100 / e.total, false); } };
  const einde = (tekst, regel) => { log(regel); upload = null; zeg(tekst); };
  xhr.onload = () => {
    let j = null; try { j = JSON.parse(xhr.responseText); } catch (e) {}
    if (j && j.result === 0) { zetBalk(100, true); einde(mapNaam ? f("MeldUploadMapKlaar", mapNaam, String(aantal)) : f("MeldUploadKlaar", bestand.name), `INFO Upload done: ${bestand.name} (${bestand.size} bytes)`); }
    else { zetBalk(0, true); einde(f("MeldUploadFout", foutTekst(j)), `ERROR Upload failed: ${bestand.name}: ${j ? j.result : xhr.status}`); }
  };
  xhr.onerror = () => { zetBalk(0, true); einde(f("MeldUploadFout", t("FoutGeenInternet")), `ERROR Upload failed: ${bestand.name}: network`); };
  xhr.onabort = () => { zetBalk(0, true); einde(t("MeldUploadGeannuleerd"), `INFO Upload cancelled: ${bestand.name}`); };
  const fd = new FormData();
  fd.append("file", bestand, bestand.name);
  log(`INFO Upload start: ${bestand.name} (${bestand.size} bytes)`);
  zetBalk(0, true);
  zeg(f("MeldUploadStart", bestand.name));
  xhr.send(fd);
}

// Escape tijdens een upload: Doorgaan (focus) of Alles nu annuleren.
function escapeVraag() {
  if (!upload) return;
  $("vraag-tekst").textContent = f("EscVraagUpload", upload.naam);
  $("vraag-uitleg").textContent = t("EscUploadUitleg");
  const terug = document.activeElement;
  $("vraag").showModal();
  $("vraag-doorgaan").focus();
  $("vraag").onclose = () => {
    if ($("vraag").returnValue === "annuleren" && upload) upload.xhr.abort();
    else if (upload) zeg(t("MeldVerder"));
    $("vraag").returnValue = "";
    if (terug && terug.focus) terug.focus();
  };
}
$("vraag-doorgaan").addEventListener("click", () => $("vraag").close("doorgaan"));
$("vraag-annuleren").addEventListener("click", () => $("vraag").close("annuleren"));
$("vraag").addEventListener("cancel", (e) => { e.preventDefault(); $("vraag").close("doorgaan"); });

window.addEventListener("beforeunload", (e) => { if (upload) { e.preventDefault(); e.returnValue = ""; } });

// ---------- Tabbladen ----------
function kiesTab(n, focus) {
  ["tab-down", "tab-up"].forEach((id, i) => {
    $(id).setAttribute("aria-selected", String(i === n));
    $(id).tabIndex = i === n ? 0 : -1;
  });
  $("paneel-down").hidden = n !== 0;
  $("paneel-up").hidden = n !== 1;
  $("werk").hidden = false;
  $("help").hidden = true;
  if (focus) $(n === 0 ? "tab-down" : "tab-up").focus();
}
$("tabs").addEventListener("click", (e) => { if (e.target.id === "tab-down") kiesTab(0, true); if (e.target.id === "tab-up") kiesTab(1, true); });
$("tabs").addEventListener("keydown", (e) => {
  const n = $("tab-up").getAttribute("aria-selected") === "true" ? 1 : 0;
  if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    kiesTab(e.key === "Home" ? 0 : e.key === "End" ? 1 : 1 - n, true);
  }
});

// ---------- Help ----------
function toonHelp(doel) {
  $("werk").hidden = true;
  $("help").hidden = false;
  $("logboek").value = logboek.join("\n");
  $(doel).focus();
}
$("knop-terug").addEventListener("click", () => kiesTab(0, true));
$("knop-kopieer").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(logboek.join("\r\n")); zeg(t("WebGekopieerd")); }
  catch (e) { $("logboek").select(); zeg(t("WebNietGekopieerd")); }
});

// ---------- Menu (zoals een menubalk in Windows) ----------
const balkknoppen = [...document.querySelectorAll('#menubalk > li > [role="menuitem"]')];
const submenu = (k) => k.nextElementSibling;
const items = (m) => [...m.querySelectorAll('[role^="menuitem"]')];
function sluitMenus() { balkknoppen.forEach((k) => { k.setAttribute("aria-expanded", "false"); submenu(k).hidden = true; }); }
function openMenu(k, eerste) {
  sluitMenus();
  k.setAttribute("aria-expanded", "true");
  const m = submenu(k);
  m.hidden = false;
  const lijstje = items(m);
  const gekozen = lijstje.find((x) => x.getAttribute("aria-checked") === "true");
  (eerste === "laatste" ? lijstje[lijstje.length - 1] : gekozen || lijstje[0]).focus();
}
function zetBalkFocus(k) { balkknoppen.forEach((x) => { x.tabIndex = x === k ? 0 : -1; }); k.focus(); }
balkknoppen.forEach((k, i) => {
  k.addEventListener("click", () => (k.getAttribute("aria-expanded") === "true" ? sluitMenus() : openMenu(k)));
  k.addEventListener("keydown", (e) => {
    const n = balkknoppen.length;
    if (e.key === "ArrowRight") { e.preventDefault(); zetBalkFocus(balkknoppen[(i + 1) % n]); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); zetBalkFocus(balkknoppen[(i + n - 1) % n]); }
    else if (e.key === "Home") { e.preventDefault(); zetBalkFocus(balkknoppen[0]); }
    else if (e.key === "End") { e.preventDefault(); zetBalkFocus(balkknoppen[n - 1]); }
    else if (["ArrowDown", "Enter", " "].includes(e.key)) { e.preventDefault(); openMenu(k); }
    else if (e.key === "ArrowUp") { e.preventDefault(); openMenu(k, "laatste"); }
  });
  submenu(k).addEventListener("keydown", (e) => {
    const lijstje = items(submenu(k));
    const j = lijstje.indexOf(document.activeElement);
    const n = balkknoppen.length;
    if (e.key === "ArrowDown") { e.preventDefault(); lijstje[(j + 1) % lijstje.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); lijstje[(j + lijstje.length - 1) % lijstje.length].focus(); }
    else if (e.key === "Home") { e.preventDefault(); lijstje[0].focus(); }
    else if (e.key === "End") { e.preventDefault(); lijstje[lijstje.length - 1].focus(); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); sluitMenus(); zetBalkFocus(k); }
    else if (e.key === "ArrowRight") { e.preventDefault(); const v = balkknoppen[(i + 1) % n]; zetBalkFocus(v); openMenu(v); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); const v = balkknoppen[(i + n - 1) % n]; zetBalkFocus(v); openMenu(v); }
    else if (e.key === "Tab") { sluitMenus(); }
  });
});
document.addEventListener("click", (e) => { if (!e.target.closest("#menubalk")) sluitMenus(); });
document.querySelectorAll("[data-actie]").forEach((el) => el.addEventListener("click", () => {
  const actie = el.dataset.actie;
  const ouder = balkknoppen.find((k) => submenu(k).contains(el));
  sluitMenus();
  if (ouder) zetBalkFocus(ouder);
  doe(actie);
}));

function doe(actie) {
  switch (actie) {
    case "vernieuwen": haalLijst(true); break;
    case "naar-download": kiesTab(0, true); break;
    case "naar-upload": kiesTab(1, true); break;
    case "taal-nl": case "taal-en":
      taal = actie.slice(5); opslag.zet("taal", taal); zetTeksten(); log("INFO Language: " + taal);
      setTimeout(() => zeg(t("TaalGekozen")), 400); break;
    case "licht": case "donker":
      weergave = actie; opslag.zet("weergave", weergave); zetWeergave(); zetTeksten(); log("INFO View: " + weergave);
      setTimeout(() => zeg(t(actie === "licht" ? "WeergaveLicht" : "WeergaveDonker")), 400); break;
    case "uitleg": toonHelp("uitleg-titel"); break;
    case "privacy": toonHelp(taal === "nl" ? "privacy-nl-titel" : "privacy-en-titel"); break;
    case "logboek": toonHelp("logboek-titel"); break;
    case "over": toonHelp("versie"); break;
  }
}

// ---------- Sneltoetsen ----------
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && upload && !$("vraag").open && !balkknoppen.some((k) => k.getAttribute("aria-expanded") === "true")) {
    e.preventDefault(); escapeVraag();
  } else if (e.key === "F1") { e.preventDefault(); doe("uitleg"); }
});
$("knop-vernieuwen").addEventListener("click", () => haalLijst(true));
$("knop-upload").addEventListener("click", startUpload);

// ---------- Start ----------
zetWeergave();
zetTeksten();
log(`INFO Start, version ${D.versie}, language ${taal}, view ${weergave}`);
haalLijst(false);
</script>
</body>
